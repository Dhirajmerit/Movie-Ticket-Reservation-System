<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0c0e1c"><title>CinéPass Admin</title>
  <style>
    :root{--bg:#0b0d1a;--panel:#14172a;--line:#2a2e4b;--text:#f9f8ff;--muted:#a3a8c5;--pink:#ff4d78;--mint:#63e6be;--gold:#ffbd59}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif}.shell{max-width:1180px;margin:auto;padding:25px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:34px}.brand{font-weight:950;font-size:1.3rem;letter-spacing:-.07em}.brand b{color:var(--pink)}a{color:inherit;text-decoration:none}.back{color:var(--muted);font-size:.88rem}.hero{display:flex;justify-content:space-between;gap:24px;align-items:end;margin-bottom:24px}.eyebrow{color:var(--mint);font-size:.72rem;letter-spacing:.13em;font-weight:900;text-transform:uppercase}.hero h1{font-size:clamp(2.2rem,6vw,4.2rem);letter-spacing:-.07em;line-height:.95;margin:9px 0}.hero p{color:var(--muted);margin:0}.status{border:1px solid #3d745f;background:#11281f;color:var(--mint);padding:10px 14px;border-radius:10px;font-size:.85rem;font-weight:700}.grid{display:grid;grid-template-columns:370px 1fr;gap:20px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:22px}.panel h2{margin:0 0 4px;font-size:1.2rem}.hint{margin:0 0 20px;color:var(--muted);font-size:.84rem}.form{display:grid;gap:13px}.row{display:grid;grid-template-columns:1fr 1fr;gap:11px}.field{display:grid;gap:6px}.field label{font-size:.74rem;font-weight:800;color:var(--muted)}input,select{border:1px solid var(--line);background:#0d1021;color:white;border-radius:9px;padding:11px;font:inherit;outline:none}input:focus,select:focus{border-color:var(--pink)}button{border:0;border-radius:9px;padding:11px 14px;background:var(--pink);color:white;font:inherit;font-weight:850;cursor:pointer}.button-row{display:flex;gap:10px}.secondary{background:transparent;border:1px solid var(--line);color:var(--text)}.notice{min-height:21px;margin:3px 0 0;color:var(--muted);font-size:.85rem}.notice.ok{color:var(--mint)}.notice.error{color:#ff91a9}.movies{overflow:hidden}.movies-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:17px}.count{background:rgba(255,189,89,.14);color:var(--gold);font-size:.74rem;font-weight:800;padding:5px 9px;border-radius:999px}table{width:100%;border-collapse:collapse;font-size:.9rem}th{text-align:left;color:var(--muted);font-size:.72rem;letter-spacing:.05em;text-transform:uppercase;padding:10px;border-bottom:1px solid var(--line)}td{padding:14px 10px;border-bottom:1px solid var(--line)}tr:last-child td{border:0}.edit{padding:7px 10px;background:rgba(99,230,190,.12);color:var(--mint);font-size:.78rem}.empty{padding:42px;text-align:center;color:var(--muted)}@media(max-width:800px){.shell{padding:18px}.top{margin-bottom:25px}.hero{display:grid;align-items:start}.grid{grid-template-columns:1fr}.panel{padding:18px}.movies{overflow:auto}.status{font-size:.75rem}.row{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <main class="shell"><header class="top"><a class="brand" href="/">CINÉ<b>PASS</b> / ADMIN</a><a class="back" href="/">← Back to site</a></header><section class="hero"><div><span class="eyebrow">Cinema operations</span><h1>Movie control room.</h1><p>Create, review, and update the movie catalogue from one place.</p></div><div class="status" id="auth-status">Checking admin access…</div></section>
    <div class="grid"><section class="panel"><h2 id="form-title">Add a movie</h2><p class="hint">Only administrators can save changes.</p><form class="form" id="movie-form"><input id="movie-id" type="hidden"><div class="field"><label for="name">Movie title</label><input id="name" required placeholder="e.g. The Last Show"></div><div class="row"><div class="field"><label for="duration">Duration (minutes)</label><input id="duration" type="number" min="1" required placeholder="120"></div><div class="field"><label for="rating">Rating</label><input id="rating" type="number" min="0" max="10" step="0.1" required placeholder="8.4"></div></div><div class="field"><label for="release">Release date</label><input id="release" type="date" required></div><div class="row"><div class="field"><label for="genre">Genre</label><select id="genre"></select></div><div class="field"><label for="language">Language</label><select id="language"></select></div></div><div class="button-row"><button id="save" type="submit">Add movie</button><button class="secondary" id="reset" type="button">Clear</button></div><div class="notice" id="notice"></div></form></section>
      <section class="panel movies"><div class="movies-head"><div><h2>Catalogue</h2><p class="hint" style="margin:3px 0 0">Select a movie to update its details.</p></div><span class="count" id="count">0 movies</span></div><div id="movie-list"><div class="empty">Loading the catalogue…</div></div></section></div>
  </main>
  <script>
    const $=s=>document.querySelector(s),token=localStorage.getItem('cinepass-token');
    const genres=['DRAMA','ACTION','ROMANTIC','COMEDY','HISTORICAL','ANIMATION','SPORTS','SOCIAL','WAR'],languages=['HINDI','ENGLISH','TELUGU','TAMIL','MARATHI','GUJARATI','PUNJSBI','KANNADA'];
    const fill=(id,items)=>$(id).innerHTML=items.map(x=>`<option value="${x}">${x}</option>`).join('');fill('#genre',genres);fill('#language',languages);
    const status=$('#auth-status'),notice=$('#notice'); const say=(text,kind='')=>{notice.textContent=text;notice.className='notice '+kind};
    if(!token){status.textContent='Sign in as an administrator on the main site first.';status.style.borderColor='#7f3148';status.style.background='#301620';status.style.color='#ff91a9'}else{status.textContent='Admin token loaded — verifying catalogue access.'}
    const api=async(path,options={})=>{const response=await fetch(path,{...options,headers:{'Content-Type':'application/json','Authorization':'Bearer '+token,...options.headers}});const data=await response.text();if(!response.ok)throw Error(response.status===403?'This account is not an administrator.':'Request failed: '+data);return data?JSON.parse(data):null};
    let movies=[];const render=()=>{const root=$('#movie-list');$('#count').textContent=`${movies.length} movie${movies.length===1?'':'s'}`;if(!movies.length){root.innerHTML='<div class="empty">No movies added yet. Use the form to create the first one.</div>';return}root.innerHTML=`<table><thead><tr><th>Movie</th><th>Release</th><th>Rating</th><th></th></tr></thead><tbody>${movies.map(m=>`<tr><td><b>${m.movieName}</b><br><small style="color:#a3a8c5">${m.genre} · ${m.language} · ${m.duration} min</small></td><td>${m.releaseDate||'—'}</td><td>★ ${m.rating}</td><td><button class="edit" data-id="${m.id}">Edit</button></td></tr>`).join('')}</tbody></table>`;root.querySelectorAll('.edit').forEach(b=>b.onclick=()=>edit(Number(b.dataset.id)))};
    const load=async()=>{if(!token)return;try{movies=await api('/movie/all');status.textContent='Administrator access confirmed.';render()}catch(e){status.textContent=e.message;status.style.borderColor='#7f3148';status.style.background='#301620';status.style.color='#ff91a9';$('#movie-list').innerHTML='<div class="empty">Your admin catalogue will appear here after an authorized sign-in.</div>'}};
    const edit=id=>{const m=movies.find(x=>x.id===id);$('#movie-id').value=m.id;$('#name').value=m.movieName;$('#duration').value=m.duration;$('#rating').value=m.rating;$('#release').value=m.releaseDate;$('#genre').value=m.genre;$('#language').value=m.language;$('#form-title').textContent=`Edit “${m.movieName}”` ;$('#save').textContent='Save changes';window.scrollTo({top:0,behavior:'smooth'})};
    const reset=()=>{$('#movie-form').reset();$('#movie-id').value='';$('#form-title').textContent='Add a movie';$('#save').textContent='Add movie';say('')};$('#reset').onclick=reset;
    $('#movie-form').onsubmit=async e=>{e.preventDefault();if(!token){say('Sign in as an administrator first.','error');return}const id=$('#movie-id').value,body={movieName:$('#name').value,duration:Number($('#duration').value),rating:Number($('#rating').value),releaseDate:$('#release').value,genre:$('#genre').value,language:$('#language').value};try{await api(id?`/movie/${id}`:'/movie/addNew',{method:id?'PUT':'POST',body:JSON.stringify(body)});say(id?'Movie updated successfully.':'Movie added successfully.','ok');reset();await load()}catch(err){say(err.message,'error')}};load();
  </script>
</body>
</html>
